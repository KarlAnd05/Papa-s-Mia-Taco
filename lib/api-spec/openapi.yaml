openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PMT Mexican Restaurant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: customers
    description: Customer management
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get dashboard statistics overview
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, email or phone
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, vip, banned]
          description: Filter by status
        - name: loyaltyTier
          in: query
          schema:
            type: string
            enum: [bronze, silver, gold, platinum]
          description: Filter by loyalty tier
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, email, totalOrders, totalSpent, lastVisitDate, createdAt]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Validation error

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StatsOverview:
      type: object
      properties:
        totalCustomers:
          type: integer
        activeCustomers:
          type: integer
        vipCustomers:
          type: integer
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        avgOrderValue:
          type: number
        newCustomersThisMonth:
          type: integer
        loyaltyTierBreakdown:
          type: object
          properties:
            bronze:
              type: integer
            silver:
              type: integer
            gold:
              type: integer
            platinum:
              type: integer
          required: [bronze, silver, gold, platinum]
      required:
        - totalCustomers
        - activeCustomers
        - vipCustomers
        - totalRevenue
        - totalOrders
        - avgOrderValue
        - newCustomersThisMonth
        - loyaltyTierBreakdown

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        totalOrders:
          type: integer
        totalSpent:
          type: number
        averageOrderValue:
          type: number
        lastVisitDate:
          type: ["string", "null"]
        firstVisitDate:
          type: ["string", "null"]
        loyaltyPoints:
          type: integer
        loyaltyTier:
          type: string
          enum: [bronze, silver, gold, platinum]
        status:
          type: string
          enum: [active, inactive, vip, banned]
        preferredContactMethod:
          type: ["string", "null"]
        marketingOptIn:
          type: boolean
        notes:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        clerkUserId:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - totalOrders
        - totalSpent
        - averageOrderValue
        - loyaltyPoints
        - loyaltyTier
        - status
        - marketingOptIn
        - tags
        - createdAt
        - updatedAt

    CustomerList:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [customers, total, page, limit, totalPages]

    CustomerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        totalOrders:
          type: integer
        totalSpent:
          type: number
        loyaltyPoints:
          type: integer
        loyaltyTier:
          type: string
          enum: [bronze, silver, gold, platinum]
        status:
          type: string
          enum: [active, inactive, vip, banned]
        preferredContactMethod:
          type: string
        marketingOptIn:
          type: boolean
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        clerkUserId:
          type: string
      required: [name]

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        totalOrders:
          type: integer
        totalSpent:
          type: number
        loyaltyPoints:
          type: integer
        loyaltyTier:
          type: string
          enum: [bronze, silver, gold, platinum]
        status:
          type: string
          enum: [active, inactive, vip, banned]
        preferredContactMethod:
          type: string
        marketingOptIn:
          type: boolean
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        clerkUserId:
          type: string
